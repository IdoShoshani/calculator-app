<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator App</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="product-label">Spring Boot</p>
        <h1>Calculator</h1>
      </div>
      <span id="health-badge" class="health-badge pending">Checking API</span>
    </header>

    <main class="workspace">
      <section class="calculator-panel" aria-label="Calculator">
        <div class="display">
          <span id="expression-value" class="expression"></span>
          <output id="result-value" class="result">0</output>
        </div>

        <div class="numpad" role="group" aria-label="Calculator keypad">
          <button class="btn btn-fn" data-action="clear">C</button>
          <button class="btn btn-fn" data-action="backspace">⌫</button>
          <div></div>
          <button class="btn btn-op" data-op="÷">÷</button>

          <button class="btn btn-digit" data-digit="7">7</button>
          <button class="btn btn-digit" data-digit="8">8</button>
          <button class="btn btn-digit" data-digit="9">9</button>
          <button class="btn btn-op" data-op="×">×</button>

          <button class="btn btn-digit" data-digit="4">4</button>
          <button class="btn btn-digit" data-digit="5">5</button>
          <button class="btn btn-digit" data-digit="6">6</button>
          <button class="btn btn-op" data-op="−">−</button>

          <button class="btn btn-digit" data-digit="1">1</button>
          <button class="btn btn-digit" data-digit="2">2</button>
          <button class="btn btn-digit" data-digit="3">3</button>
          <button class="btn btn-op" data-op="+">+</button>

          <button class="btn btn-digit btn-zero" data-digit="0">0</button>
          <button class="btn btn-digit" data-action="decimal">.</button>
          <button class="btn btn-eq" data-action="equals">=</button>
        </div>
      </section>

      <aside class="side-panel" aria-label="API details">
        <section class="panel-block">
          <h2>Request</h2>
          <code id="request-preview">—</code>
          <a id="raw-api-link" href="#" target="_blank" rel="noreferrer">Open raw response</a>
        </section>

        <section class="panel-block">
          <h2>Status</h2>
          <div id="success-panel" class="message success hidden"></div>
          <div id="error-panel" class="message error hidden" role="alert"></div>
          <a href="/actuator/health" target="_blank" rel="noreferrer">Open health endpoint</a>
        </section>
      </aside>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
